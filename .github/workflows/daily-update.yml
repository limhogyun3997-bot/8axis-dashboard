name: 📊 Daily Market Data Update

# 매일 KST 08:00 자동 실행 (미국 시장 마감 직후, 한국 출근 전)
# UTC 23:00 = KST 08:00
on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = KST 08:00 (다음날)
  # 수동 실행도 가능 — Actions 탭에서 'Run workflow' 클릭
  workflow_dispatch:
  # update_data.py 변경 시 자동 실행
  push:
    paths:
      - 'update_data.py'
      - 'score_stocks.py'
      - 'tech_analysis.py'
      - '.github/workflows/daily-update.yml'

# data.json 자동 푸시 + 실패 시 issue 생성 권한
permissions:
  contents: write
  issues: write

# 동시 실행 방지 (push trigger + cron + manual 충돌 방지)
concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 📊 Run data updater
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_data.py

      - name: 🔍 Run stock scorer
        run: python score_stocks.py || echo "⚠️ 종목 점수화 실패 — scores.json 갱신 건너뜀"

      - name: 📐 Run technical analyzer
        run: python tech_analysis.py || echo "⚠️ 기술분석 실패 — tech.json 갱신 건너뜀"

      - name: 🔔 Run alert notifier
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_TICKERS: ${{ secrets.ALERT_TICKERS }}
        run: python notify.py || echo "⚠️ 알림 스킵"

      - name: 📝 Show summary
        run: |
          python -c "
          import json
          with open('data.json') as f:
              d = json.load(f)
          print(f\"갱신 시각: {d['last_updated_kst']}\")
          print(f\"신호: 긍정 {d['summary']['positive']} / 중립 {d['summary']['neutral']} / 부정 {d['summary']['negative']}\")
          print(f\"국면: {d['summary']['phase']}\")
          print(f\"전략: {d['summary']['strategy']}\")
          print(f\"수집: {sum(1 for v in d['prices'].values() if v)}/{len(d['prices'])}\")
          "

      - name: 💾 Commit & push (robust)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 변경사항 확인 (data / scores / tech / alert_state)
          if git diff --quiet data.json scores.json tech.json alert_state.json; then
            echo "📭 변경사항 없음"
            exit 0
          fi

          # 새 결과물 백업
          cp data.json /tmp/data_new.json
          [ -f scores.json ] && cp scores.json /tmp/scores_new.json
          [ -f tech.json ] && cp tech.json /tmp/tech_new.json
          [ -f alert_state.json ] && cp alert_state.json /tmp/alert_new.json
          TIMESTAMP=$(TZ=Asia/Seoul date +"%Y-%m-%d %H:%M KST")

          # 3회 재시도 with reset 전략
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data_new.json data.json
            [ -f /tmp/scores_new.json ] && cp /tmp/scores_new.json scores.json
            [ -f /tmp/tech_new.json ] && cp /tmp/tech_new.json tech.json
            [ -f /tmp/alert_new.json ] && cp /tmp/alert_new.json alert_state.json
            git add data.json scores.json tech.json alert_state.json

            if git diff --staged --quiet; then
              echo "📭 변경사항 없음 (remote가 이미 최신)"
              exit 0
            fi

            git commit -m "🤖 자동 갱신: ${TIMESTAMP}"

            if git push origin main 2>&1; then
              echo "✅ data.json 갱신 푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ Push 실패 (시도 $i회) — 대기 후 재시도"
            sleep $((i * 5))
          done
          echo "❌ 3회 재시도 후에도 push 실패"
          exit 1

      - name: 🚨 Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0,10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Daily Update 실패 (${today})`,
              body: `워크플로우 \`📊 Daily Market Data Update\`가 실패했습니다.\n\n- Run #${context.runNumber}\n- [실행 로그 보기](${runUrl})\n\n주요 원인 후보:\n- Yahoo Finance rate limit (자주 발생 시 Stooq fallback 작동)\n- FRED API 키 만료\n- GitHub push race condition\n\n수동 재실행: Actions 탭 → Run workflow`,
              labels: ['workflow-failure', 'auto-created']
            });
