name: 📊 Daily Market Data Update

# 매일 KST 08:00 자동 실행 (미국 시장 마감 직후, 한국 출근 전)
# UTC 23:00 = KST 08:00
on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = KST 08:00 (다음날)
  # 수동 실행도 가능 — Actions 탭에서 'Run workflow' 클릭
  workflow_dispatch:
  # update_data.py 변경 시 자동 실행
  push:
    paths:
      - 'update_data.py'
      - '.github/workflows/daily-update.yml'

# data.json 자동 푸시 권한
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: 📊 Run data updater
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_data.py

      - name: 📝 Show summary
        run: |
          python -c "
          import json
          with open('data.json') as f:
              d = json.load(f)
          print(f\"갱신 시각: {d['last_updated_kst']}\")
          print(f\"신호: 긍정 {d['summary']['positive']} / 중립 {d['summary']['neutral']} / 부정 {d['summary']['negative']}\")
          print(f\"국면: {d['summary']['phase']}\")
          print(f\"전략: {d['summary']['strategy']}\")
          print(f\"수집: {sum(1 for v in d['prices'].values() if v)}/{len(d['prices'])}\")
          "

      - name: 💾 Commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          if git diff --staged --quiet; then
            echo "📭 변경사항 없음"
          else
            TIMESTAMP=$(TZ=Asia/Seoul date +"%Y-%m-%d %H:%M KST")
            git commit -m "🤖 자동 갱신: ${TIMESTAMP}"
            git push
            echo "✅ data.json 갱신 푸시 완료"
          fi
