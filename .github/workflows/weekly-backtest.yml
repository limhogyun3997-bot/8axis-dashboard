name: 🔬 Weekly Backtest

# 매주 월요일 KST 08:00 (UTC 일요일 23:00)
# 한 주의 시작 시점에 5년 백테스트 재실행 → backtest.json 갱신
on:
  schedule:
    - cron: '0 23 * * 0'  # UTC 일요일 23:00 = KST 월요일 08:00
  # 수동 실행
  workflow_dispatch:
  # backtest_run.py 변경 시 자동 실행
  push:
    paths:
      - 'backtest_run.py'
      - '.github/workflows/weekly-backtest.yml'

permissions:
  contents: write
  issues: write

# 다른 워크플로우와의 push 충돌 방지
concurrency:
  group: weekly-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    # 백테스트는 시간이 더 걸리므로 타임아웃 늘림
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: 🔬 Run 5-year backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest_run.py

      - name: 📊 Summary
        run: |
          python -c "
          import json
          d = json.load(open('backtest.json'))
          print(f\"갱신: {d['last_updated'][:19]}\")
          print(f\"기간: {d['period_start']} ~ {d['period_end']}\")
          print(f\"시점: {d['total_points']}\")
          print(f\"Hit Rate (강세→3M+): {d['stats']['overall']['bull_hit_3m']}%\")
          print(f\"Hit Rate (약세→3M-): {d['stats']['overall']['bear_hit_3m']}%\")
          print(f\"평균 점수: {d['stats']['overall']['avg_score']}\")
          "

      - name: 💾 Commit & push (robust)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 변경사항 확인
          if git diff --quiet backtest.json; then
            echo "📭 변경사항 없음 (시장이 휴장 또는 데이터 동일)"
            exit 0
          fi

          # 새 backtest.json 백업
          cp backtest.json /tmp/backtest_new.json

          TS=$(TZ=Asia/Seoul date +"%Y-%m-%d %H:%M KST")

          # 3회 재시도 with reset 전략
          for i in 1 2 3; do
            # Remote의 최신 상태로 강제 동기화
            git fetch origin main
            git reset --hard origin/main
            # 새 backtest.json 다시 적용
            cp /tmp/backtest_new.json backtest.json
            git add backtest.json

            if git diff --staged --quiet; then
              echo "📭 변경사항 없음 (remote가 이미 최신)"
              exit 0
            fi

            git commit -m "🔬 백테스트 자동 갱신: ${TS}"

            if git push origin main 2>&1; then
              echo "✅ backtest.json 갱신 푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ Push 실패 (시도 $i회) — 잠시 대기 후 재시도"
            sleep $((i * 5))
          done
          echo "❌ 3회 재시도 후에도 push 실패"
          exit 1

      - name: 🚨 Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0,10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Weekly Backtest 실패 (${today})`,
              body: `워크플로우 \`🔬 Weekly Backtest\`가 실패했습니다.\n\n- Run #${context.runNumber}\n- [실행 로그](${runUrl})\n\n주요 원인 후보:\n- 백테스트 데이터 fetch 실패 (FRED rate limit)\n- 5년 yfinance 다운로드 타임아웃\n- push race condition\n\n수동 재실행: Actions 탭 → Run workflow`,
              labels: ['workflow-failure', 'auto-created']
            });
